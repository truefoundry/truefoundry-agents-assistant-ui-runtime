name: Feature request
description: Propose an enhancement to the runtime, plugin, or docs
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime (useAgentRuntime / sessions / streaming)
        - TrueFoundry plugin (createTrueFoundry*)
        - Docs
        - Examples / demos
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? API shape if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — workarounds or other approaches.
